name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nextpay
          POSTGRES_PASSWORD: nextpay
          POSTGRES_DB: nextpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextpay -d nextpay"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Database tests skip without this; in CI they must always run.
      NEXTPAY_TEST_DATABASE_URL: postgresql+psycopg://nextpay:nextpay@localhost:5432/nextpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: Format check
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy
      - name: Engine boundary
        run: uv run lint-imports
      - name: Migrations match the models
        env:
          NEXTPAY_DATABASE_URL: postgresql+psycopg://nextpay:nextpay@localhost:5432/nextpay
        run: |
          uv run alembic -c backend/alembic.ini upgrade head
          uv run alembic -c backend/alembic.ini check
      - name: Tests
        run: uv run pytest --cov=nextpay_engine --cov=app --cov-report=term-missing
