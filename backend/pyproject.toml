[project]
name = "nextpay-backend"
version = "0.1.0"
description = "NextPay FastAPI backend."
requires-python = ">=3.12"
dependencies = [
    "nextpay-engine",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
