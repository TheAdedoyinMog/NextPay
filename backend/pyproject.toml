[project]
name = "nextpay-backend"
version = "0.1.0"
description = "NextPay FastAPI backend."
requires-python = ">=3.12"
dependencies = [
    "nextpay-engine",
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
