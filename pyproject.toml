[project]
name = "nextpay"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["engine", "backend"]

[tool.uv.sources]
nextpay-engine = { workspace = true }
nextpay-backend = { workspace = true }

[dependency-groups]
dev = [
    "nextpay-engine",
    "nextpay-backend",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2",
    "pre-commit>=3",
    "httpx2>=2.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nextpay_engine", "app"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nextpay_engine", "app"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "backend/tests"]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_packages = ["nextpay_engine", "app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine stays pure: no backend, web, or database imports"
type = "forbidden"
source_modules = ["nextpay_engine"]
forbidden_modules = ["app", "fastapi", "sqlalchemy", "pydantic"]
